{% extends "base_landing.html" %}
{% load static %}
{% block content %}
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <div class="docs-layout mx-auto max-w-[1400px] px-5 py-8 sm:px-6 lg:px-8 lg:py-12"
         data-docs-page>
        <div class="flex flex-col gap-8 lg:flex-row lg:gap-12">
            <aside class="docs-sidebar" aria-label="Documentation sections">
                <nav class="docs-desktop-nav" aria-label="Docs navigation">
                    {% include "pages/docs/navigation.html" %}
                </nav>
                <details class="docs-mobile-nav">
                    <summary class="app-focus">Browse docs</summary>
                    <nav aria-label="Docs navigation">
                        {% include "pages/docs/navigation.html" %}
                    </nav>
                </details>
            </aside>
            <div class="min-w-0 flex-1" id="docs-main-content">
                <article class="prose prose-lg max-w-none prose-gray prose-headings:font-black prose-a:text-orange-700 prose-a:no-underline prose-a:hover:underline prose-code:rounded prose-code:bg-transparent prose-code:px-0 prose-code:py-0 prose-code:text-gray-800 prose-code:before:content-none prose-code:after:content-none prose-pre:my-0 prose-pre:overflow-x-auto prose-pre:rounded-2xl prose-pre:bg-gray-950 prose-pre:p-5 prose-pre:pr-20 prose-pre:text-gray-100 prose-pre:shadow-sm dark:prose-invert dark:prose-a:text-orange-300 dark:prose-code:bg-transparent dark:prose-code:text-gray-100 docs-code-blocks"
                         data-toc-content>
                    {% block docs_content %}
                    {% endblock docs_content %}
                </article>
            </div>
            <aside class="hidden flex-shrink-0 xl:block xl:w-64"
                   data-toc-sidebar
                   aria-label="Page table of contents">
                <nav class="sticky top-24 space-y-4">
                    <h2 class="docs-nav-heading px-3">On this page</h2>
                    <ul class="space-y-0" data-toc-list>
                    </ul>
                </nav>
            </aside>
        </div>
    </div>
{% endblock content %}
