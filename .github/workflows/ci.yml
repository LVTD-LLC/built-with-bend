name: CI
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    name: Quality and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: built_with_bend
          POSTGRES_USER: bend
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bend -d built_with_bend"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DJANGO_READ_DOT_ENV: '0'
      SECRET_KEY: ci-only-not-used-in-production
      ENVIRONMENT: test
      SITE_URL: http://localhost:8000
      DATABASE_URL: postgres://bend:ci-only-password@127.0.0.1:5432/built_with_bend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: uv sync --locked
      - run: npm ci --include=dev
      - run: make ci-local
  image:
    name: Production container build
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          push: false
          build-args: DEPLOYMENT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
