name: Deploy production
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: built-with-bend-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    if: github.repository == 'LVTD-LLC/built-with-bend'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      CAPROVER_SERVER: https://captain.cr.lvtd.dev
      IMAGE: ghcr.io/lvtd-llc/built-with-bend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Confirm this revision is still the tip of main
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" || {
            echo "::error::A newer commit is on main. Use its deployment run."
            exit 1
          }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: DEPLOYMENT_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/LVTD-LLC/built-with-bend
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy web
        uses: caprover/deploy-from-github@68ab51ebfb8da5054c20427f4e8e654a1cb2fbbf
        with:
          server: ${{ env.CAPROVER_SERVER }}
          app: builtwithbend
          token: ${{ secrets.APP_TOKEN }}
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
      - name: Verify web revision
        run: node scripts/wait-for-revision.mjs https://builtwithbend.com/health/ "$GITHUB_SHA"
      - name: Deploy worker
        uses: caprover/deploy-from-github@68ab51ebfb8da5054c20427f4e8e654a1cb2fbbf
        with:
          server: ${{ env.CAPROVER_SERVER }}
          app: builtwithbend-workers
          token: ${{ secrets.WORKERS_APP_TOKEN }}
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
      - name: Verify worker revision
        run: node scripts/wait-for-revision.mjs https://builtwithbend.com/health/workers/ "$GITHUB_SHA"
